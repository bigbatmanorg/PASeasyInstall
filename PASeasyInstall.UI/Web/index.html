<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PASeasyInstall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <button id="nav-home" class="brand" title="Back to the start page">PASeasyInstall</button>
  <nav id="steps" aria-label="Steps"></nav>
  <span id="mode-badge" class="badge sim" hidden>Simulation</span>
  <label class="switch" title="Show the settings most labs never need">
    <input type="checkbox" id="opt-advanced"> Advanced
  </label>
</header>

<div id="notice" role="status" aria-live="polite"></div>

<main id="view"></main>

<footer id="bar"></footer>

<dialog id="dlg-confirm" aria-labelledby="dlg-confirm-title">
  <h2 id="dlg-confirm-title">Confirm</h2>
  <p id="dlg-confirm-text"></p>
  <div class="dlg-actions">
    <button id="dlg-confirm-no" class="btn">Cancel</button>
    <button id="dlg-confirm-yes" class="btn primary">OK</button>
  </div>
</dialog>

<dialog id="dlg-password" aria-labelledby="dlg-password-title">
  <form id="dlg-password-form">
    <h2 id="dlg-password-title">Password needed</h2>
    <p id="dlg-password-text"></p>
    <label for="dlg-password-value">Lab password</label>
    <input type="password" id="dlg-password-value" autocomplete="off">
    <p class="hint">The window keeps no password after an installation has started, so it asks again here.</p>
    <div class="dlg-actions">
      <button type="button" id="dlg-password-no" class="btn">Cancel</button>
      <button type="submit" id="dlg-password-yes" class="btn primary">Continue</button>
    </div>
  </form>
</dialog>

</body>
</html>
