<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PASeasyInstall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <button id="nav-home" class="brand" title="Back to the start page">PASeasyInstall</button>
  <nav id="steps" aria-label="Steps"></nav>
  <span id="mode-badge" class="badge sim" hidden>Simulation</span>
  <label class="switch" title="Show the settings most labs never need">
    <input type="checkbox" id="opt-advanced"> Advanced
  </label>
</header>

<div id="notice" role="status" aria-live="polite"></div>

<main id="view"></main>

<footer id="bar"></footer>

<dialog id="dlg-confirm" aria-labelledby="dlg-confirm-title">
  <h2 id="dlg-confirm-title">Confirm</h2>
  <p id="dlg-confirm-text"></p>
  <div class="dlg-actions">
    <button id="dlg-confirm-no" class="btn">Cancel</button>
    <button id="dlg-confirm-yes" class="btn primary">OK</button>
  </div>
</dialog>

<dialog id="dlg-creds" aria-labelledby="dlg-creds-title">
  <form id="dlg-creds-form">
    <h2 id="dlg-creds-title">Accounts needed</h2>
    <p id="dlg-creds-text"></p>
    <div id="dlg-creds-fields"></div>
    <p class="hint">Passwords are kept in memory only. This window was opened after the installation started, so it asks again.</p>
    <div class="dlg-actions">
      <button type="button" id="dlg-creds-no" class="btn">Cancel</button>
      <button type="submit" id="dlg-creds-yes" class="btn primary">Continue</button>
    </div>
  </form>
</dialog>

</body>
</html>
