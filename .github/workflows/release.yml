name: Release

# Tag vX.Y.Z or vX.Y.Z-rcN to build, create the GitHub release (portable ZIP + SHA256SUMS) and publish
# the PASeasyInstall module to the PowerShell Gallery.
# The tag must match ModuleVersion (+ PSData.Prerelease) in PASeasyInstall/PASeasyInstall.psd1.
#
# Publishing again: when the Gallery step failed (for example the API key was refused),
# run this workflow by hand with publish_tag set to the tag, for example v2.0.0. It builds that tag again and
# publishes the module version when it is not on the Gallery yet. The GitHub release is left as it is.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Tag to publish to the PowerShell Gallery again (only what is missing there), e.g. v2.0.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || github.ref }}

      - name: Install Pester and NativeHTMLKit
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module NativeHTMLKit -RequiredVersion 0.1.2 -Scope CurrentUser -Force

      - name: Version
        id: version
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          $d = Import-PowerShellDataFile .\PASeasyInstall\PASeasyInstall.psd1
          $pre = [string]$d['PrivateData']['PSData']['Prerelease']
          $v = [string]$d.ModuleVersion + $(if ($pre) { "-$pre" } else { '' })
          $tag = ''
          if ($env:PUBLISH_TAG) { $tag = $env:PUBLISH_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          if ($tag -and $tag -ne "v$v") {
            throw "Tag $tag does not match the manifest version v$v"
          }
          # ASCII: Windows PowerShell's utf8 encoding writes a BOM, which would corrupt the first output name.
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value "version=$v"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value ("prerelease=" + ([bool]$pre).ToString().ToLowerInvariant())

      - name: Static check and tests
        run: .\Tools\Invoke-CITests.ps1 -ResultPath test-results.xml

      - name: Build the Gallery package and the portable ZIP
        run: .\Tools\Build-PortableRelease.ps1 -Output dist | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/gallery/**
          if-no-files-found: error

  github-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          cat > notes.md <<NOTES
          PASeasyInstall $VERSION builds CyberArk PAM self-hosted **labs**. Production use is at your own risk.

          - **Portable:** download \`PASeasyInstall-$VERSION-portable.zip\`, unblock it, extract it and run \`Start-PASeasyInstall.cmd\`. NativeHTMLKit is included, and nothing is installed.
          - **PowerShell Gallery:** \`Install-Module PASeasyInstall$( [ "$PRERELEASE" = "true" ] && echo ' -AllowPrerelease')\`. Then \`Start-PASeasyInstall\` opens the desktop window, or use the commands, for example \`Install-PASVault\` or \`Install-PASLab\`.

          SHA256: see \`SHA256SUMS\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "PASeasyInstall $VERSION" --notes-file notes.md "${flags[@]}"

  publish:
    needs: [build, github-release]
    # After a tag push: when the GitHub release was created. By hand with publish_tag: after the build.
    if: ${{ always() && needs.build.result == 'success' && ((github.ref_type == 'tag' && needs.github-release.result == 'success') || inputs.publish_tag != '') }}
    runs-on: windows-latest
    environment: powershellgallery
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish PASeasyInstall to the PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'Secret POWERSHELL_GALLERY_API_KEY is not set in environment powershellgallery' }
          # A fresh runner has no PSResourceGet repository store yet: register PSGallery when it is missing.
          if (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue) {
            Set-PSResourceRepository -Name PSGallery -Trusted
          } else {
            Register-PSResourceRepository -PSGallery -Trusted
          }
          $version = '${{ needs.build.outputs.version }}'
          function Publish-IfMissing([string]$Name) {
            # A version that is already on the Gallery is left alone, so this step can be run again.
            $found = Find-PSResource -Name $Name -Version $version -Prerelease -Repository PSGallery -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host "$Name $version is already on the PowerShell Gallery: skipped."
              return
            }
            Publish-PSResource -Path "dist/gallery/$Name" -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -Verbose
          }
          # One module, without required modules.
          Publish-IfMissing 'PASeasyInstall'
